org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# ---------------------------------------------------------------------------
# 构建用 JDK：必须是 17
#
# 原因：本工程用 Gradle 8.9 + AGP 8.7.3，只支持 JDK 17~22。
# 而 Android Studio 2026.2 自带的 JBR 是 JDK 25，直接用它会立刻失败：
#     BUG! exception in phase 'semantic analysis' in source unit '_BuildScript_'
#     Unsupported class file major version 69      (69 = Java 25)
# 已实测：同一工程在 JDK 25 下报上述错误，换 JDK 17 即编译通过。
#
# 下面这行显式指定构建用的 JDK，与 IDE 自带 JBR 解耦。
# 若你把 JDK 17 装到别处，改这一行即可（注意用正斜杠或转义反斜杠）。
# ---------------------------------------------------------------------------
org.gradle.java.home=D:\\Android\\JDK17
